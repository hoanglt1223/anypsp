evidence = "anypsp build to a Linux program and to a debug APK (arm64-v8a + x86_64, 17 MB). The APK runs 300 vblanks on an API 35 x86_64 emulator (SwiftShader GLES 3.0) through platform/android/emulator-smoke.sh; its last frame, the textured spinning cube, matches the desktop interpreter's (anypsp-interp-gpu, 2x) within 8 levels per channel. This needs the import-stub fix of the code generator (ffb6e1d on feat/codegen-vfpu): without it translated libgu code skips sceGeListUpdateStallAddr and sceGeDrawSync and every frame is black."
