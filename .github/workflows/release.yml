name: release

# A pushed tag v* builds the AnyPSP tools for each host (anypsp, anypsp-analyze, psp_recomp, the
# interpreter players and the sources games are compiled against, with SDL3) and attaches one archive
# per host to a GitHub Release. No game data, firmware or keys are packaged.
on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - name: windows-x64
            os: windows-2022
            configure: -G "Visual Studio 17 2022" -A x64
            archive: zip
          - name: linux-x64
            os: ubuntu-24.04
            configure: -G Ninja -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++ -DCMAKE_CXX_SCAN_FOR_MODULES=OFF
            archive: tar.gz

    env:
      SDL_VIDEO_DRIVER: offscreen
      SDL_AUDIO_DRIVER: dummy

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install SDL and Mesa build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build \
            libasound2-dev libpulse-dev libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev libxss-dev \
            libxfixes-dev libxtst-dev libwayland-dev libxkbcommon-dev wayland-protocols libdecor-0-dev \
            libegl1-mesa-dev libgl1-mesa-dev libgles2-mesa-dev libgl1-mesa-dri libdrm-dev libgbm-dev libudev-dev libdbus-1-dev

      - name: Configure
        run: cmake -S . -B out ${{ matrix.configure }} -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build out --config Release --parallel --target anypsp anypsp-analyze psp_recomp anypsp-play anypsp-interp

      - name: Install into the package directory
        shell: bash
        run: |
          pkg="anypsp-${GITHUB_REF_NAME}-${{ matrix.name }}"
          echo "PKG=$pkg" >> "$GITHUB_ENV"
          cmake --install out --config Release --prefix "dist/$pkg"

      # The packaged pipeline end to end on a homebrew demo fetched from pspautotests (not packaged).
      - name: Check the package builds and runs a game
        shell: bash
        run: |
          python tests/fetch-corpus.py
          exe=""; [ "$RUNNER_OS" = Windows ] && exe=.exe
          "dist/$PKG/bin/anypsp$exe" build tests/corpus/pspautotests/demos/cubevfpu.prx -o smoke --name cubevfpu --opt d
          "smoke/cubevfpu/cubevfpu$exe" --headless --frames 60 | tee smoke.log
          grep -q "frame limit reached" smoke.log

      - name: Archive (zip)
        if: matrix.archive == 'zip'
        shell: pwsh
        run: Compress-Archive -Path "dist/$env:PKG" -DestinationPath "dist/$env:PKG.zip"

      - name: Archive (tar.gz)
        if: matrix.archive == 'tar.gz'
        run: tar -C dist -czf "dist/$PKG.tar.gz" "$PKG"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PKG }}
          path: dist/${{ env.PKG }}.${{ matrix.archive }}
          if-no-files-found: error

  publish:
    needs: [package]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true

      - name: Create the release and attach the archives
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -l assets
          gh release create "$GITHUB_REF_NAME" assets/*.zip assets/*.tar.gz \
            --repo "$GITHUB_REPOSITORY" \
            --title "AnyPSP $GITHUB_REF_NAME" \
            --generate-notes \
            --verify-tag
